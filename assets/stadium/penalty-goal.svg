<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
<title id="t">Penalty: GOAL</title><desc id="d">Animated penalty kick. The ball curls into the top corner, the keeper dives the wrong way, and the scoreboard reads GOAL, now pick a zone.</desc>
<defs><clipPath id="card"><rect width="1200" height="600" rx="28"/></clipPath><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101A3A"/><stop offset="1" stop-color="#05070D"/></linearGradient><linearGradient id="dim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05070D" stop-opacity=".7"/><stop offset="1" stop-color="#05070D" stop-opacity=".2"/></linearGradient><pattern id="crowd" width="16" height="12" patternUnits="userSpaceOnUse"><rect width="16" height="12" fill="#121C33"/><circle cx="4" cy="4" r="3" fill="#2A3556"/><circle cx="12" cy="7" r="3" fill="#3A4870"/><circle cx="8" cy="11" r="2.5" fill="#1E2A47"/></pattern><radialGradient id="glow"><stop offset="0" stop-color="#F6F9FF" stop-opacity=".7"/><stop offset=".4" stop-color="#FFE9A8" stop-opacity=".22"/><stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/></radialGradient><pattern id="net" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 0H24M0 0V24" stroke="#E9F2EC" stroke-opacity=".28" stroke-width="1.5" fill="none"/></pattern></defs>
<style>text{font-family:'Segoe UI','Helvetica Neue',Roboto,Arial,sans-serif}.fb{transform-box:fill-box;transform-origin:center}.keeper{transform-box:view-box;transform-origin:600px 340px;transform:translate(-175px,30px) rotate(-68deg);animation:dive 6s ease-out infinite}
.bx{transform:translateX(0);animation:bx 6s linear infinite}.by{transform:translateY(0);animation:by 6s linear infinite}.bs{transform:scale(.55);animation:bs 6s ease-out infinite}
.net{animation:ripple 6s ease-out infinite}.g1{animation:g1 6s ease-out infinite}.g2{animation:g2 6s ease-out infinite}
@keyframes bx{0%,10%{transform:translateX(-240px);opacity:1}20%,94%{transform:translateX(0);opacity:1}100%{transform:translateX(0);opacity:0}}
@keyframes by{0%,10%{transform:translateY(342px);animation-timing-function:cubic-bezier(.12,.85,.3,1)}20%,100%{transform:translateY(0)}}
@keyframes bs{0%,10%{transform:scale(1)}20%,100%{transform:scale(.55)}}
@keyframes dive{0%,13%{transform:translate(0,0) rotate(0)}22%,100%{transform:translate(-175px,30px) rotate(-68deg)}}
@keyframes ripple{0%,19%{transform:scale(1)}23%{transform:scale(1.035)}27%{transform:scale(.99)}31%,100%{transform:scale(1)}}
@keyframes g1{0%,20%{opacity:0}26%,94%{opacity:1}100%{opacity:0}}@keyframes g2{0%,36%{opacity:0}44%,94%{opacity:1}100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<g clip-path="url(#card)"><rect width="1200" height="600" fill="#05070D"/><rect width="1200" height="600" fill="url(#sky)"/><rect y="0" width="1200" height="380" fill="url(#crowd)" opacity=".85"/><rect width="1200" height="380" fill="url(#dim)"/>
<circle cx="140" cy="60" r="120" fill="url(#glow)"/><circle cx="1060" cy="60" r="120" fill="url(#glow)"/><rect x="0" y="380" width="1200" height="37" fill="#0E5A2B"/><rect x="0" y="417" width="1200" height="37" fill="#13803A"/><rect x="0" y="454" width="1200" height="37" fill="#0E5A2B"/><rect x="0" y="491" width="1200" height="37" fill="#13803A"/><rect x="0" y="528" width="1200" height="37" fill="#0E5A2B"/><rect x="0" y="565" width="1200" height="37" fill="#13803A"/>
<g fill="none" stroke="#E9F2EC" stroke-width="4" stroke-opacity=".8"><path d="M0 380H1200"/><path d="M420 380L380 450H820L780 380"/></g><circle cx="600" cy="520" r="7" fill="#E9F2EC"/>
<rect x="300" y="130" width="600" height="250" fill="#0A0F1E" fill-opacity=".85"/><g class="net fb"><rect x="300" y="130" width="600" height="250" fill="url(#net)"/></g>
<path d="M300 380V130H900V380" fill="none" stroke="#E9F2EC" stroke-width="12" stroke-linejoin="round"/>
<g class="keeper" fill="none" stroke="#3A4C7E" stroke-linecap="round"><path d="M588 340L570 382M612 340L630 382" stroke-width="16"/><rect x="574" y="250" width="52" height="92" rx="18" fill="#2B3A62" stroke="#3A4C7E" stroke-width="3"/><circle cx="600" cy="230" r="20" fill="#2B3A62" stroke-width="3"/><path d="M578 264L535 232M622 264L665 232" stroke-width="14"/><circle cx="532" cy="230" r="13" fill="#2EE6FF" stroke="none"/><circle cx="668" cy="230" r="13" fill="#2EE6FF" stroke="none"/></g>
<rect x="400" y="24" width="400" height="150" rx="12" fill="#0A0F1E" stroke="#1E2A47" stroke-width="4"/>
<g class="g1"><text x="481" y="100" font-size="68" font-weight="900" fill="#FFB020" textLength="238" lengthAdjust="spacingAndGlyphs">GOAL!</text></g><g class="g2"><text x="420" y="150" font-size="40" font-weight="700" fill="#E9F2EC" textLength="360" lengthAdjust="spacingAndGlyphs">NOW PICK A ZONE</text></g>
<g transform="translate(840 178)"><g class="bx"><g class="by"><g class="bs"><circle r="26" fill="#F4F7FA" stroke="#9AA5B5" stroke-width="2"/><path d="M0-13l11 8-4 13H-7l-4-13z" fill="#1A2236"/><path d="M-18-16l7 6M18-16l-7 6M0 26v-12" stroke="#1A2236" stroke-width="3" fill="none"/></g></g></g></g></g>
</svg>
