<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" role="img" aria-labelledby="t d">
<title id="t">Pitch divider</title><desc id="d">A chalk halfway line across the pitch with a ball rolling along it.</desc>
<defs><clipPath id="card"><rect width="1200" height="140" rx="28"/></clipPath></defs>
<style>text{font-family:'Segoe UI','Helvetica Neue',Roboto,Arial,sans-serif}.fb{transform-box:fill-box;transform-origin:center}.dl{stroke-dasharray:1;animation:draw 1.2s ease-out both}.roll{animation:roll 10s ease-in-out infinite}.spin{animation:spin 10s ease-in-out infinite}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes roll{0%{transform:translateX(540px)}45%,100%{transform:translateX(-540px)}}@keyframes spin{0%{transform:rotate(0)}45%,100%{transform:rotate(-1080deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<g clip-path="url(#card)"><rect width="1200" height="140" fill="#05070D"/><rect x="0" y="36" width="60" height="68" fill="#0E5A2B"/><rect x="60" y="36" width="60" height="68" fill="#13803A"/><rect x="120" y="36" width="60" height="68" fill="#0E5A2B"/><rect x="180" y="36" width="60" height="68" fill="#13803A"/><rect x="240" y="36" width="60" height="68" fill="#0E5A2B"/><rect x="300" y="36" width="60" height="68" fill="#13803A"/><rect x="360" y="36" width="60" height="68" fill="#0E5A2B"/><rect x="420" y="36" width="60" height="68" fill="#13803A"/><rect x="480" y="36" width="60" height="68" fill="#0E5A2B"/><rect x="540" y="36" width="60" height="68" fill="#13803A"/><rect x="600" y="36" width="60" height="68" fill="#0E5A2B"/><rect x="660" y="36" width="60" height="68" fill="#13803A"/><rect x="720" y="36" width="60" height="68" fill="#0E5A2B"/><rect x="780" y="36" width="60" height="68" fill="#13803A"/><rect x="840" y="36" width="60" height="68" fill="#0E5A2B"/><rect x="900" y="36" width="60" height="68" fill="#13803A"/><rect x="960" y="36" width="60" height="68" fill="#0E5A2B"/><rect x="1020" y="36" width="60" height="68" fill="#13803A"/><rect x="1080" y="36" width="60" height="68" fill="#0E5A2B"/><rect x="1140" y="36" width="60" height="68" fill="#13803A"/><rect y="36" width="1200" height="68" fill="#05070D" fill-opacity=".25"/><path pathLength="1" class="dl" d="M0 70H1200" stroke="#E9F2EC" stroke-width="3" stroke-opacity=".85" fill="none"/><circle cx="600" cy="70" r="26" fill="none" stroke="#E9F2EC" stroke-width="3" stroke-opacity=".85"/>
<g class="roll"><g class="spin fb"><circle cx="600" cy="70" r="18" fill="#F4F7FA" stroke="#9AA5B5" stroke-width="1.5"/><path d="M600 62l7 5-3 8h-8l-3-8z" fill="#1A2236"/></g></g></g>
</svg>
