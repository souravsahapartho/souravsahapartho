<title id="t">Full time: stadium exit</title><desc id="d">The stadium exterior at night. Four gates: website, email, LinkedIn, blog. The floodlights power down and a board reads full time, thanks for visiting.</desc>
<defs><clipPath id="card"><rect width="1200" height="460" rx="28"/></clipPath><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101A3A"/><stop offset="1" stop-color="#05070D"/></linearGradient><linearGradient id="arch" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE9A8" stop-opacity=".38"/><stop offset="1" stop-color="#0A0F1E"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#F6F9FF" stop-opacity=".7"/><stop offset=".4" stop-color="#FFE9A8" stop-opacity=".22"/><stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/></radialGradient></defs>
