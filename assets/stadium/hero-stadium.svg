<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">Matchday stadium at night</title><desc id="d">A night-time football stadium with four floodlights switching on. The scoreboard reads Sourav Saha, CSE, UIU, full-stack. A technology ticker scrolls along the pitch-side board.</desc>
<defs><clipPath id="card"><rect width="1200" height="630" rx="28"/></clipPath><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101A3A"/><stop offset="1" stop-color="#05070D"/></linearGradient><linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05070D" stop-opacity=".55"/><stop offset=".6" stop-color="#05070D" stop-opacity=".1"/><stop offset="1" stop-color="#05070D" stop-opacity="0"/></linearGradient><pattern id="crowd" width="16" height="12" patternUnits="userSpaceOnUse"><rect width="16" height="12" fill="#121C33"/><circle cx="4" cy="4" r="3" fill="#2A3556"/><circle cx="12" cy="7" r="3" fill="#3A4870"/><circle cx="8" cy="11" r="2.5" fill="#1E2A47"/></pattern><linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE9A8" stop-opacity=".34"/><stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#F6F9FF" stop-opacity=".7"/><stop offset=".4" stop-color="#FFE9A8" stop-opacity=".22"/><stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/></radialGradient></defs>
<style>text{font-family:'Segoe UI','Helvetica Neue',Roboto,Arial,sans-serif}.fb{transform-box:fill-box;transform-origin:center}.pw{animation:powerOn .9s ease-out both}.bi{animation:beamIn .8s ease-out both}.shim{animation:shimmer 8s ease-in-out infinite alternate}.veil{animation:unveil 1.2s ease-out 1.4s both}
.tick{animation:ticker 30s linear infinite}.bob{animation:bob 2.4s ease-in-out infinite}.fl{opacity:0;animation:flash 9s infinite}
@keyframes powerOn{0%{opacity:0}60%{opacity:1}70%{opacity:.6}100%{opacity:1}}@keyframes beamIn{from{opacity:0}to{opacity:1}}@keyframes shimmer{from{opacity:1}to{opacity:.78}}@keyframes unveil{from{opacity:.78}to{opacity:0}}
