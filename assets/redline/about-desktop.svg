<title id="t">About me</title><desc id="d">CSE student at UIU, Dhaka. I build full-stack web apps with Node.js, Express and MySQL, and Android apps with Flutter. Most of what I ship serves the UIU community. I also write about tech at TechTalk with Sourav. Focus: full-stack web, mobile with Flutter, databases, problem solving.</desc>
