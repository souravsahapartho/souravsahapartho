="#2A0A0E" stroke-width="2" stroke-dasharray="3 9"/><circle class="a fade" style="--d:0.40s" cx="752" cy="165" r="84" fill="#171717"/><text class="sg7 a up" x="752" y="187" font-size="64" fill="#FF1744" text-anchor="middle" style="--d:0.50s">SS</text><circle class="a draw" style="--d:0.50s" pathLength="1" cx="752" cy="165" r="92" fill="none" stroke="#FF1744" stroke-width="3" stroke-linecap="round" transform="rotate(-90 752 165)"/><g class="smil"><circle cx="752" cy="165" r="92" fill="none" stroke="#FF1744" stroke-width="2" opacity="0"><animate attributeName="r" values="92;118" dur="3.2s" begin="1.60s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0" dur="3.2s" begin="1.60s" repeatCount="indefinite"/></circle><circle r="3.5" fill="#FF3030" opacity="0"><animate attributeName="opacity" values="0;1" dur=".1s" begin="1.60s" fill="freeze"/><animateMotion dur="9s" begin="1.60s" repeatCount="indefinite" path="M752 65 a100 100 0 1 1 -.01 0z"/></circle></g></g>
