<style>@font-face{font-family:'SG5';font-weight:500;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'SG7';font-weight:700;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'JB5';font-weight:500;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'JB7';font-weight:700;src:url(data:font/woff;base64,) format('woff')}.sg5{font-family:'SG5','Segoe UI',Inter,Arial,sans-serif;font-weight:500}.sg7{font-family:'SG7','Segoe UI',Inter,Arial,sans-serif;font-weight:700}.jb5{font-family:'JB5','Cascadia Code',Consolas,Menlo,monospace;font-weight:500}.jb7{font-family:'JB7','Cascadia Code',Consolas,Menlo,monospace;font-weight:700}
