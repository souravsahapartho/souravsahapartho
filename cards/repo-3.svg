<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 214" width="900" height="214" role="img" aria-labelledby="t d">
<title id="t">UIU Student Assistant: GitHub repository</title><desc id="d">UIU Student Assistant. A Python-powered Telegram assistant for UIU students, featuring CGPA &amp; fee calculators, scholarship estimation, academic information, notices, calendar updates, and useful university resources.</desc>
