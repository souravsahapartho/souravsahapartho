<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-labelledby="t d">
<title id="t">About me</title><desc id="d">About me. CSE student at UIU, Dhaka. I build full-stack web apps with Node.js, Express and MySQL, and Android apps with Flutter. Most of what I ship serves the UIU community. I also write about tech at TechTalk with Sourav. B.Sc. in CSE, United International University, Dhaka, Bangladesh · Ongoing.</desc>
<defs><clipPath id="card"><rect width="900" height="250" rx="22"/></clipPath><radialGradient id="gl" cx="1" cy="0" r="1"><stop offset="0" stop-color="#FF3030" stop-opacity=".16"/><stop offset="1" stop-color="#FF3030" stop-opacity="0"/></radialGradient></defs>
<style>@font-face{font-family:'SG5';font-weight:500;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'SG7';font-weight:700;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'JB5';font-weight:500;src:url(data:font/woff;base64,) format('woff')}.sg5{font-family:'SG5','Segoe UI',Inter,Arial,sans-serif;font-weight:500}.sg7{font-family:'SG7','Segoe UI',Inter,Arial,sans-serif;font-weight:700}.jb5{font-family:'JB5','Cascadia Code',Consolas,Menlo,monospace;font-weight:500}.jb7{font-family:'JB7','Cascadia Code',Consolas,Menlo,monospace;font-weight:700}
.a{animation-duration:.7s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;animation-delay:var(--d,0s)}
.up{animation-name:up}@keyframes up{from{opacity:0;transform:translateY(12px)}}
.fade{animation-name:fade}@keyframes fade{from{opacity:0}}
.pop{animation-name:pop;transform-box:fill-box;transform-origin:50% 50%}@keyframes pop{from{opacity:0;transform:scale(.4)}}
.sweep{animation-name:sweep;animation-duration:.9s;transform-box:fill-box;transform-origin:0 50%}@keyframes sweep{from{transform:scaleX(0)}}
.grow{animation-name:grow;animation-duration:.9s;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(0)}}
.draw{animation-name:draw;animation-duration:1.4s;stroke-dasharray:1}@keyframes draw{from{stroke-dashoffset:1}}
.trv{opacity:0;animation:trv 10s linear infinite;animation-delay:var(--d,0s)}
@keyframes trv{0%{opacity:1;stroke-dashoffset:0}22%{opacity:1;stroke-dashoffset:-1000}22.1%,100%{opacity:0;stroke-dashoffset:-1000}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.smil{display:none}}
</style>
