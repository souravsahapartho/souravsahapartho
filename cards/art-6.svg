<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 152" width="440" height="152" role="img" aria-labelledby="t d">
<title id="t">All articles</title><desc id="d">All articles on the TechTalk with Sourav blog.</desc>
<defs><clipPath id="card"><rect width="440" height="152" rx="20"/></clipPath><radialGradient id="gl" cx="1" cy="0" r="1"><stop offset="0" stop-color="#FF3030" stop-opacity=".16"/><stop offset="1" stop-color="#FF3030" stop-opacity="0"/></radialGradient></defs>
<style>@font-face{font-family:'SG7';font-weight:700;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'JB5';font-weight:500;src:url(data:font/woff;base64,) format('woff')}.sg5{font-family:'SG5','Segoe UI',Inter,Arial,sans-serif;font-weight:500}.sg7{font-family:'SG7','Segoe UI',Inter,Arial,sans-serif;font-weight:700}.jb5{font-family:'JB5','Cascadia Code',Consolas,Menlo,monospace;font-weight:500}.jb7{font-family:'JB7','Cascadia Code',Consolas,Menlo,monospace;font-weight:700}
.a{animation-duration:.45s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both;animation-delay:var(--d,0s)}
.up{animation-name:up}@keyframes up{from{opacity:0;transform:translateY(12px)}}
.fade{animation-name:fade}@keyframes fade{from{opacity:0}}
.pop{animation-name:pop;transform-box:fill-box;transform-origin:50% 50%}@keyframes pop{from{opacity:0;transform:scale(.4)}}
.sweep{animation-name:sweep;animation-duration:.55s;transform-box:fill-box;transform-origin:0 50%}@keyframes sweep{from{transform:scaleX(0)}}
.grow{animation-name:grow;animation-duration:.55s;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(0)}}
.draw{animation-name:draw;animation-duration:.9s;stroke-dasharray:1}@keyframes draw{from{stroke-dashoffset:1}}
.trv{opacity:0;animation:trv 10s linear infinite;animation-delay:var(--d,0s)}
@keyframes trv{0%{opacity:1;stroke-dashoffset:0}22%{opacity:1;stroke-dashoffset:-1000}22.1%,100%{opacity:0;stroke-dashoffset:-1000}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.smil{display:none}}
</style>
<g clip-path="url(#card)"><rect width="440" height="152" fill="#080808"/><rect x="1" y="1" width="438" height="150" rx="19" fill="none" stroke="#2A0A0E" stroke-width="2"/><rect class="trv" style="--d:1.45s" pathLength="1000" x="1" y="1" width="438" height="150" rx="19" fill="none" stroke="#FF1744" stroke-width="3" stroke-linecap="round" stroke-dasharray="90 910"/><rect class="a sweep" style="--d:0.97s" x="1" y="1" width="438" height="3" fill="#C2003A"/><g class="a pop" style="--d:1.00s"><circle cx="220" cy="60" r="26" fill="none" stroke="#FF1744" stroke-width="2.5"/></g><g transform="translate(207 47)"><g transform="translate(0 0) scale(1.083)" fill="none" stroke="#FF1744" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></g></g><text class="sg7 a up" x="220" y="118" font-size="20" fill="#F5F5F5" text-anchor="middle" style="--d:1.02s">All articles</text><text class="jb5 a up" x="220" y="137" font-size="12.5" fill="#A1A1AA" text-anchor="middle" style="--d:1.05s">blog.sourav.com.bd</text></g>
</svg>
