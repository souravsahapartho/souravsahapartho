name: Stadium Scoreboard

on:
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/scoreboard.mjs"
      - ".github/workflows/scoreboard.yml"

permissions:
  contents: write

concurrency:
  group: readme-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate scoreboard
        run: node scripts/scoreboard.mjs
        env:
          GH_TOKEN: ${{ secrets.SUMMARY_CARDS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stadium/generated/scoreboard.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore(stadium): update scoreboard"
          git pull --rebase origin main
          git push
