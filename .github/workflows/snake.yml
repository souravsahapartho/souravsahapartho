name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: souravsahapartho
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FF1744&color_dots=#161616,#4A0A12,#8B0000,#D0102F,#FF3030
            dist/github-contribution-grid-snake-light.svg?color_snake=#8B0000&color_dots=#EDEDED,#FFC9D2,#FF8A9B,#E0203F,#8B0000

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
